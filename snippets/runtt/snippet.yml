# The honesty test for this snippet: a competent Zephyr developer with existing
# firmware gets onto the platform by adding the module to west.yml, appending
# `-Dapp_SNIPPET=runtt` to their build, and wrapping it in the two-stage
# Dockerfile (a top-level `-S` would apply the snippet to MCUboot too).
# Under an hour, no source changes.
name: runtt
append:
  EXTRA_CONF_FILE: runtt.conf
boards:
  # native_sim exposes its UARTs as host ptys, so the two contract channels are
  # ptys there and become the dual CDC-ACM composite on hardware. Same overlay
  # shape either way, which is the point.
  native_sim:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/native_sim.overlay
      EXTRA_CONF_FILE: boards/native_sim.conf
  native_sim/native/64:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/native_sim.overlay
      EXTRA_CONF_FILE: boards/native_sim.conf
  # On hardware the two channels become a dual CDC-ACM composite. A regex so the
  # /rp2040 and /rp2040/mcuboot variants are both covered.
  #
  # It also covers the Pico 2 and Pico 2 W (RP2350), and that is deliberate rather
  # than accidental: Zephyr matches this key against "$BOARD/$BOARD_QUALIFIERS"
  # anchored at both ends (scripts/snippets.py), so `rpi_pico.*` catches
  # `rpi_pico2/rp2350a/m33/w` too. Nothing here needs to change for RP2350 -- it
  # uses the same `raspberrypi,pico-usbd` driver behind the same `zephyr_udc0`
  # label and also has 16 bidirectional endpoints, so the conf and overlay below
  # are correct as-is. Verified on a Pico 2 W: both interface string descriptors
  # in the linked ELF, a deploy that swaps and confirms, and a deliberately
  # unmanageable image that reverts.
  #
  # If some future RP2350 board does need different settings, do NOT add a second
  # `/rpi_pico2.*/` key beside this one: each entry emits its own `if()` rather
  # than an `elif`, so both would match and both files would be appended. Narrow
  # this key instead.
  /rpi_pico.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/rpi_pico.overlay
      EXTRA_CONF_FILE: boards/rpi_pico.conf
  # The CAN bus Feather is also an RP2040 behind the same zephyr_udc0, so the
  # OVERLAY is the Pico's, shared rather than copied. The conf cannot be: the
  # snippet schema takes exactly one EXTRA_CONF_FILE per key, so the board's
  # conf embeds a copy of rpi_pico.conf plus the CAN transport -- the copy and
  # the reason are both declared at the top of that file. The board dts already
  # chooses zephyr,canbus (the onboard MCP25625).
  /adafruit_feather_canbus_rp2040.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/rpi_pico.overlay
      EXTRA_CONF_FILE: boards/adafruit_feather_canbus_rp2040.conf
  # Same composite on nRF52840. The regex covers the /nrf52840 and /nrf52840/uf2
  # targets, but note only the plain one is usable: the uf2 variant's partition
  # layout (nordic/nrf52840_partition_uf2_sdv6.dtsi) keeps Adafruit's bootloader
  # and has no slot0/slot1 at all, so there is nothing for MCUboot to swap.
  /adafruit_feather_nrf52840.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/adafruit_feather_nrf52840.overlay
      EXTRA_CONF_FILE: boards/adafruit_feather_nrf52840.conf
