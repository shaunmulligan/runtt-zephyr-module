# ESP32-S3: the RP2040 USB contract configuration, on a dwc2 UDC.
#
# The USB half of this file IS rpi_pico.conf, copied -- the snippet schema
# allows exactly one EXTRA_CONF_FILE per board key (see
# adafruit_feather_canbus_rp2040.conf for the long form of that note). If
# rpi_pico.conf changes, change this too.

# The new USB device stack, default since Zephyr 4.3 and the only one that
# survives 4.5 (the legacy stack is removed there). It is also the stack that
# reads the devicetree `label` as the interface string descriptor.
CONFIG_USB_DEVICE_STACK_NEXT=y

# NOT CDC_ACM_SERIAL_INITIALIZE_AT_BOOT: it registers only the first CDC-ACM
# instance, so the log channel never enumerates. RUNTT_USB does the setup
# and registers them all. See the module's usbd.c.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_RUNTT_USB=y
CONFIG_HWINFO=y

CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

# Each CDC-ACM instance costs 3 endpoints (bulk in, bulk out, interrupt in).
# The S3's dwc2 budget also carries two instances (IDF's tinyusb runs two
# CDC ports on this silicon), proven in the linked ELF and on the wire.

# DEFERRED LOGGING IS MANDATORY ON THIS SoC, and it is the snippet's job to say
# so rather than the application's.
#
# With CONFIG_LOG_MODE_IMMEDIATE every LOG_INF is written synchronously from
# whichever context logs -- including the USB device thread and its ISRs. A
# blocking 115200-baud UART write inside enumeration misses the host's timing
# windows, and the composite never finishes coming up: the device reaches
# "usbd_core: Actual device speed 1" (so the host HAS issued a bus reset and set
# the speed) and then stalls with no control transfers completing.
#
# Proven by single-variable change: the identical build with IMMEDIATE failed to
# enumerate five times out of five, and with DEFERRED enumerates and answers
# describe. Nothing else differed.
#
# This matters beyond our own template. app-test/prj.conf sets IMMEDIATE and
# describes itself as "what a customer's own application config would look
# like", so any firmware written from that starting point would hit this. The
# snippet overrides it because EXTRA_CONF_FILE merges after the application's
# prj.conf, which is exactly the layer that should carry a per-SoC constraint.
CONFIG_LOG_MODE_DEFERRED=y
