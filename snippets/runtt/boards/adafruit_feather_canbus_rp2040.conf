# Adafruit Feather RP2040 CAN bus: the Pico's RP2040 USB contract, plus CAN.
#
# The first half of this file IS rpi_pico.conf, copied. Not by choice: the
# snippet schema allows exactly one EXTRA_CONF_FILE per board key (type:
# string, and snippets.py validates the value as a single path), so a board
# cannot point at rpi_pico.conf and add its own fragment. If rpi_pico.conf
# changes, change this too -- and the overlay at least is shared, not copied:
# snippet.yml points this board at boards/rpi_pico.overlay itself.

# The new USB device stack, default since Zephyr 4.3 and the only one that
# survives 4.5 (the legacy stack is removed there). It is also the stack that
# reads the devicetree `label` as the interface string descriptor.
CONFIG_USB_DEVICE_STACK_NEXT=y

# NOT CDC_ACM_SERIAL_INITIALIZE_AT_BOOT: it registers only the first CDC-ACM
# instance, so the log channel never enumerates. RUNTT_USB does the setup
# and registers them all. See the module's usbd.c.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_RUNTT_USB=y
CONFIG_HWINFO=y

CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

# Each CDC-ACM instance costs 3 endpoints (bulk in, bulk out, interrupt in).
# RP2040 has 16 bidirectional, so two instances is comfortable.


# ---------------------------------------------------------------------------
# The CAN transport -- the point of this board. This half is NOT in
# rpi_pico.conf.
# ---------------------------------------------------------------------------

# The onboard MCP25625 is an MCP2515 with the transceiver integrated; the board
# dts declares it on spi1 with /chosen/zephyr,canbus already pointing at it.
CONFIG_SPI=y
CONFIG_CAN=y

# SMP over ISO-TP on CAN -- the module's own transport (Zephyr ships none for
# CAN). ISOTP is `depends on`, not selected; see the RUNTT_SMP_CAN Kconfig
# note about the NET_BUF recursion.
CONFIG_ISOTP=y
CONFIG_RUNTT_SMP_CAN=y

# 500 kbit/s, set here rather than left to the 125 kbit/s default so the wire
# rate is written down where a porter will look. The host side must match, and
# restart-ms is not optional in practice: a bus fault (an unplugged wire, a
# dead node) drives the host controller BUS-OFF, and with restart-ms 0 it stays
# there silently until an operator notices. 1 s auto-restart keeps the host
# side of a deploy tool alive across transients.
#   ip link set can0 up type can bitrate 500000 restart-ms 1000
# 500k rather than 1M: the MCP2515's 16 MHz oscillator gives 8 TQ per bit at
# 1M, which leaves no headroom for resynchronisation.
CONFIG_CAN_DEFAULT_BITRATE=500000
