# Board-independent half of the contract.

CONFIG_BALENA_MCU=y

# --- SMP over the console transport -------------------------------------
# The console transport (base64 + CRC16 framing) rather than the raw one,
# because raw cannot share a line with log output and single-channel targets
# need exactly that.
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_UART_MCUMGR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_ZCBOR=y
CONFIG_NET_BUF=y

# --- mandatory command groups -------------------------------------------
CONFIG_MCUMGR_GRP_OS=y
# Lets a host discover that our per-user group exists rather than probing blindly.
CONFIG_MCUMGR_GRP_ENUM=y

# The image group and its dependencies are selected by
# CONFIG_BALENA_MCU_IMG_MGMT, whose default follows whether the board actually
# has a slot to stage into. See the module's Kconfig.

CONFIG_REBOOT=y

# Deliberately NOT enabling CONFIG_IMG_ENABLE_IMAGE_CHECK.
#
# It would make the device compute the uploaded image's SHA itself and report
# `match` on the final chunk. But it selects FLASH_AREA_CHECK_INTEGRITY, which
# pulls in mbedtls -- and mbedtls needs its tf-psa-crypto GIT SUBMODULE, which a
# `west update --narrow` does not fetch. That is a real prerequisite for the
# hardware targets (MCUboot signature verification needs it) and should be
# sorted out there, with `west update --submodules`.
#
# We lose little: the runtime reads `image list` after uploading and compares
# the device-reported MCUboot digest against the one it parsed from the image's
# own TLV area. That verifies the STORED image end to end, which is stronger
# than a checksum over the received bytes. Expect a benign
# "Device did not perform image checksum verification" warning from the client.

# The host asks for these to size its frames instead of assuming defaults.
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

# --- buffer sizing, which is easy to get subtly wrong -------------------
#
# The MCUmgr-parameters command reports NETBUF_SIZE to the client, and the
# client sizes its SMP frames from that. But the UART transport enforces its own
# separate MTU, which defaults to 256. Leave them mismatched and the client
# cheerfully sends frames the transport cannot accept, which shows up only as
# "uart_mcumgr: Insufficient buffers, fragment dropped" on the device and a
# timeout on the host. So pin MTU == NETBUF_SIZE.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1024
CONFIG_MCUMGR_TRANSPORT_UART_MTU=1024
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4

# Zephyr documents the constraint as
#   RX_BUF_COUNT * RX_BUF_SIZE >= MCUMGR_TRANSPORT_UART_MTU
# which is necessary but not sufficient. Each received LINE takes one whole
# buffer until the packet is reassembled, so COUNT must also cover the number of
# lines per packet. Console framing caps a line at 127 bytes (124 of base64), so
# a 1024-byte frame is ceil(1024 * 4/3 / 124) = 12 lines. 16 gives headroom.
CONFIG_UART_MCUMGR_RX_BUF_SIZE=256
CONFIG_UART_MCUMGR_RX_BUF_COUNT=16
