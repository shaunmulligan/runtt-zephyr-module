# native_sim specifics.

# Each UART on its own pty. Do NOT use _ON_STDINOUT: it had an instance-ordering
# bug with multiple UARTs, and we want both channels addressable as devices.
CONFIG_UART_NATIVE_PTY=y
CONFIG_UART_NATIVE_PTY_0_ON_OWN_PTY=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

# Note: native_sim also mirrors console output to the simulator process's own
# stdout, and that cannot be turned off from here -- the board unconditionally
# does `select POSIX_ARCH_CONSOLE`, and a select cannot be overridden by a conf
# fragment. It is harmless: the log CHANNEL carries the output either way (the
# runtime forwards that), and the simulator's stdout goes to whatever launched
# it rather than into the container. Do not assert on the simulator's stdout in
# tests, though -- a test could pass there while the actual channel was silent.

# MCUboot cannot chain-load on native_sim: its POSIX path computes
# flash_base + offset and calls it as a function pointer, and "flash" here is an
# mmap'd data file with no PROT_EXEC holding a signed image for another
# architecture. So no bootloader, and img_mgmt runs without one -- IMG_MANAGER
# depends on STREAM_FLASH, not on the bootloader.
CONFIG_BOOTLOADER_MCUBOOT=n

# Software reset works: it re-execs the process, preserving argv.
CONFIG_NATIVE_SIM_REBOOT=y

# img_mgmt will not compile without FLASH_LOAD_OFFSET. See the help text on
# this symbol: at v4.4.2 native_sim's partitions are still fixed-partitions, so
# the Kconfig gate that would provide it is closed.
CONFIG_BALENA_MCU_SIM_SLOT_SHIM=y
