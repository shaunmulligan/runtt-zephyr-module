# RP2040 specifics.

# The new USB device stack, default since Zephyr 4.3 and the only one that
# survives 4.5 (the legacy stack is removed there). It is also the stack that
# reads the devicetree `label` as the interface string descriptor.
CONFIG_USB_DEVICE_STACK_NEXT=y

# NOT CDC_ACM_SERIAL_INITIALIZE_AT_BOOT: it registers only the first CDC-ACM
# instance, so the log channel never enumerates. BALENA_MCU_USB does the setup
# and registers them all. See the module's usbd.c.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_BALENA_MCU_USB=y
CONFIG_HWINFO=y

CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

# Each CDC-ACM instance costs 3 endpoints (bulk in, bulk out, interrupt in).
# RP2040 has 16 bidirectional, so two instances is comfortable.
