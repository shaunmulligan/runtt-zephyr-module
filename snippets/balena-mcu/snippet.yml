# The honesty test for this snippet: a competent Zephyr developer with existing
# firmware gets onto the platform by adding the module to west.yml, appending
# `-S balena-mcu` to their build, and wrapping it in the two-stage Dockerfile.
# Under an hour, no source changes.
name: balena-mcu
append:
  EXTRA_CONF_FILE: balena-mcu.conf
boards:
  # native_sim exposes its UARTs as host ptys, so the two contract channels are
  # ptys there and become the dual CDC-ACM composite on hardware. Same overlay
  # shape either way, which is the point.
  native_sim:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/native_sim.overlay
      EXTRA_CONF_FILE: boards/native_sim.conf
  native_sim/native/64:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/native_sim.overlay
      EXTRA_CONF_FILE: boards/native_sim.conf
