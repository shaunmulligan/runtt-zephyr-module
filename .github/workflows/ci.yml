name: CI

on:
  push:
  pull_request:

env:
  ZEPHYR_SDK_VERSION: 1.0.1

jobs:
  # ---------------------------------------------------------------------------
  # This repo builds NOTHING on its own -- it is a Zephyr module, not a manifest
  # repo and not an application. So CI assembles a workspace from runtt-boards,
  # which supplies both the manifest and an application to build against, and
  # then builds this module into it for every supported board.
  #
  # That makes this the one repo whose CI depends on another. The alternative was
  # carrying a manifest and a test app here, which would make the thing a
  # firmware author adds to their own west.yml considerably bigger for the sake
  # of its own tests.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-24.04
    env:
      # Pin to a runtt-boards tag once its manifest is stable enough to warrant
      # it. A branch means a change over there can turn this red with nothing
      # changing here.
      RUNTT_BOARDS_REF: main
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install west and build tools
        run: |
          pip install --quiet west pyelftools cryptography intelhex click cbor2 jsonschema
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build device-tree-compiler

      - name: Cache the west workspace
        uses: actions/cache@v4
        with:
          path: |
            zephyr
            modules
            bootloader
            boards
            .west
          key: west-${{ env.RUNTT_BOARDS_REF }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Assemble a workspace from runtt-boards
        run: |
          west init -m https://github.com/shaunmulligan/runtt-boards \
                    --mr "${RUNTT_BOARDS_REF}" . 2>/dev/null || echo "already initialised"
          west update --narrow -o=--depth=1
          pip install --quiet -r zephyr/scripts/requirements-base.txt

      # Replace the module west just fetched with THIS commit. Without this the
      # job would test whatever is on the module's default branch and pass
      # regardless of the change under review -- a green tick that means nothing.
      - name: Check out this commit over the fetched module
        uses: actions/checkout@v4
        with:
          path: modules/runtt
          clean: true

      - name: The module's own contract assertion
        run: ./modules/runtt/tests/contract_version.sh

      # native_sim needs no SDK: it compiles with the host toolchain. It goes
      # first because it is the cheapest way to find a broken Kconfig or snippet.
      - name: Build for native_sim
        working-directory: boards
        run: ./scripts/build-native-sim.sh

      - name: Cache the Zephyr SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}-arm

      - name: Install the ARM toolchain only
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          west sdk install --version "${ZEPHYR_SDK_VERSION}" \
            --install-base "${GITHUB_WORKSPACE}" -t arm-zephyr-eabi

      - name: Point Zephyr at it
        run: echo "ZEPHYR_SDK_INSTALL_DIR=${GITHUB_WORKSPACE}/zephyr-sdk-${ZEPHYR_SDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build for every supported board
        working-directory: boards
        run: |
          set -euo pipefail
          ./scripts/boards.py --build-plan | while read -r script _mode; do
            echo "=== $script mcuboot ==="
            "./$script" mcuboot
          done

      # The interface string descriptors are contract: the host matches on them,
      # and a board advertising different ones is simply not found.
      #
      # Check the LINKED ARTEFACT, not the config. This exact check caught
      # build-feather.sh passing a snippet flag for an image name that no longer
      # existed -- sysbuild ignores that silently and exits zero, so the build
      # produced firmware with no SMP server and no contract in it, and every
      # source-level check passed.
      #
      # Only APPLICATION images of USB targets carry the descriptors. MCUboot has
      # no USB contract, and native_sim uses ptys, so both legitimately lack them;
      # keying off CONFIG_RUNTT_USB rather than a path glob keeps this honest as
      # boards are added.
      - name: The contract is in the built images, not just the config
        working-directory: boards
        run: |
          set -euo pipefail
          shopt -s nullglob
          checked=0
          for cfg in build-*/*/zephyr/.config; do
            grep -q "^CONFIG_RUNTT_USB=y" "$cfg" || continue
            elf="$(dirname "$cfg")/zephyr.elf"
            [ -f "$elf" ] || { echo "::error::$cfg enables USB but $elf is missing"; exit 1; }
            for iface in runtt-mgmt runtt-log; do
              if strings "$elf" | grep -qx "$iface"; then
                echo "  $elf: $iface"
              else
                echo "::error::$elf enables RUNTT_USB but does not contain the $iface descriptor"
                exit 1
              fi
            done
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::no USB-target application images were found to check."
            echo "Either no board built, or the snippet was not applied to any of them --"
            echo "which is the failure this step exists to catch."
            exit 1
          fi
          echo "checked $checked USB application image(s)"

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning --exclude=SC1091 tests/*.sh
